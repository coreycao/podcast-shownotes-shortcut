<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shownotes">
<meta name="theme-color" content="#5e5ce6">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>播客 Shownotes</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner">📡 当前离线，显示缓存内容</div>

<button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

<div class="container">
  <!-- Home -->
  <div class="view active" id="viewHome">
    <div class="home-header">
      <h1>播客 Shownotes</h1>
      <p>搜索播客，查看节目笔记</p>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="输入播客名称..." autocomplete="off">
        <button id="searchBtn">搜索</button>
      </div>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Episodes -->
  <div class="view" id="viewEpisodes">
    <button class="back-btn" id="backToSearch">← 返回搜索</button>
    <div id="podcastHeader"></div>
    <div id="episodeList"></div>
  </div>

  <!-- Show Notes -->
  <div class="view" id="viewShowNotes">
    <button class="back-btn" id="backToEpisodes">← 返回剧集列表</button>
    <div id="shownotesContent"></div>
  </div>
</div>

<script src="./config.js" defer></script>
<script type="module" src="./app.js"></script>
</body>
</html>
