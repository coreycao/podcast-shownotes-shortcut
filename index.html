<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shownotes">
<meta name="theme-color" content="#5e5ce6">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>播客 Shownotes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fa;--surface:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;
  --primary:#5e5ce6;--primary-light:#7c7aed;--primary-bg:#ededfd;
  --radius:12px;--max-w:800px;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surface:#1a1a2e;--text:#e5e7eb;--text2:#9ca3af;--border:#2d2d44;
  --primary:#8b8bf5;--primary-light:#a5a5f7;--primary-bg:#1e1e3a;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100dvh;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  transition:background .3s,color .3s;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* Offline banner */
.offline-banner{
  display:none;background:#f59e0b;color:#1a1a2e;text-align:center;
  padding:8px 16px;font-size:14px;font-weight:600;position:sticky;top:0;z-index:100;
}
.offline-banner.show{display:block}

/* Theme toggle */
.theme-toggle{
  position:fixed;top:calc(12px + var(--safe-top));right:12px;z-index:50;
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:transform .15s;
}
.theme-toggle:active{transform:scale(.9)}

/* Layout */
.container{max-width:var(--max-w);margin:0 auto;padding:16px}

/* View transitions */
.view{display:none;animation:fadeIn .2s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Home */
.home-header{text-align:center;padding:60px 0 32px}
.home-header h1{font-size:28px;font-weight:700;margin-bottom:8px}
.home-header p{color:var(--text2);font-size:15px;margin-bottom:32px}
.search-box{display:flex;gap:8px;max-width:480px;margin:0 auto}
.search-box input{
  flex:1;padding:12px 16px;border-radius:var(--radius);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-size:16px;outline:none;
  transition:border-color .2s;
}
.search-box input:focus{border-color:var(--primary)}
.search-box button{
  padding:12px 20px;border-radius:var(--radius);border:none;
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;transition:opacity .15s,transform .1s;
}
.search-box button:active{transform:scale(.96)}

.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:16px}

/* Search results */
.results-grid{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.podcast-card{
  display:flex;gap:14px;padding:14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  transition:transform .1s,box-shadow .2s;
}
.podcast-card:active{transform:scale(.98)}
.podcast-card img{width:72px;height:72px;border-radius:8px;flex-shrink:0}
.podcast-card .info{flex:1;min-width:0}
.podcast-card .info h3{font-size:15px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podcast-card .info p{font-size:13px;color:var(--text2);line-height:1.4}
.podcast-card .info .meta{font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}

/* Podcast header */
.podcast-header{
  display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:16px;
}
.podcast-header img{width:100px;height:100px;border-radius:12px;flex-shrink:0}
.podcast-header .info{flex:1;min-width:0}
.podcast-header .info h2{font-size:20px;font-weight:700;margin-bottom:4px}
.podcast-header .info p{font-size:14px;color:var(--text2)}

/* Back button */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 0;
  color:var(--primary);font-size:15px;font-weight:500;cursor:pointer;
  border:none;background:none;transition:opacity .15s;
}
.back-btn:active{opacity:.6}

/* Episode list */
.episode-list{display:flex;flex-direction:column;gap:8px}
.episode-card{
  padding:14px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--border);cursor:pointer;
  transition:transform .1s,box-shadow .2s;
}
.episode-card:active{transform:scale(.98)}
.episode-card.highlighted{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.episode-card h3{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.4}
.episode-card .meta{font-size:13px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;padding:60px 20px;color:var(--text2)}
.spinner{
  width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error-state{text-align:center;padding:60px 20px}
.error-state .icon{font-size:48px;margin-bottom:16px}
.error-state p{color:var(--text2);margin-bottom:20px}
.error-state button{
  padding:10px 24px;border-radius:var(--radius);border:none;
  background:var(--primary);color:#fff;font-size:15px;cursor:pointer;
}

/* Shownotes */
.shownotes-header{padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
.shownotes-header h2{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:6px}
.shownotes-header .meta{font-size:13px;color:var(--text2)}
.shownotes-content{
  font-size:16px;line-height:1.8;word-break:break-word;
}
.shownotes-content h1,.shownotes-content h2,.shownotes-content h3{
  font-weight:700;margin:1.2em 0 .6em;line-height:1.3;
}
.shownotes-content h1{font-size:22px}
.shownotes-content h2{font-size:19px}
.shownotes-content h3{font-size:17px}
.shownotes-content p{margin:.8em 0}
.shownotes-content strong,.shownotes-content b{font-weight:700}
.shownotes-content em,.shownotes-content i{font-style:italic}
.shownotes-content a{color:var(--primary)}
.shownotes-content img{max-width:100%;height:auto;border-radius:8px;margin:1em 0}
.shownotes-content blockquote{
  border-left:4px solid var(--primary);background:var(--primary-bg);
  padding:12px 16px;margin:1em 0;border-radius:0 8px 8px 0;
}
.shownotes-content ul,.shownotes-content ol{padding-left:1.5em;margin:.6em 0}
.shownotes-content li{margin:.3em 0}
.shownotes-content pre{
  background:var(--surface);border:1px solid var(--border);
  padding:12px;border-radius:8px;overflow-x:auto;margin:1em 0;
}
.shownotes-content code{
  font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:14px;
}
.shownotes-content :not(pre)>code{
  background:var(--primary-bg);padding:2px 6px;border-radius:4px;
}
.shownotes-content table{width:100%;border-collapse:collapse;margin:1em 0}
.shownotes-content th,.shownotes-content td{
  border:1px solid var(--border);padding:8px 12px;text-align:left;font-size:14px;
}
.shownotes-content th{background:var(--surface);font-weight:600}
.shownotes-content hr{border:none;border-top:1px solid var(--border);margin:1.5em 0}
.shownotes-content iframe{display:none}
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">📡 当前离线，显示缓存内容</div>

<button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

<div class="container">
  <!-- Home -->
  <div class="view active" id="viewHome">
    <div class="home-header">
      <h1>播客 Shownotes</h1>
      <p>搜索播客，查看节目笔记</p>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="输入播客名称..." autocomplete="off">
        <button id="searchBtn">搜索</button>
      </div>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Episodes -->
  <div class="view" id="viewEpisodes">
    <button class="back-btn" id="backToSearch">← 返回搜索</button>
    <div id="podcastHeader"></div>
    <div id="episodeList"></div>
  </div>

  <!-- Show Notes -->
  <div class="view" id="viewShowNotes">
    <button class="back-btn" id="backToEpisodes">← 返回剧集列表</button>
    <div id="shownotesContent"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const views = { home: $('#viewHome'), episodes: $('#viewEpisodes'), shownotes: $('#viewShowNotes') };

  let currentPodcast = null;
  let currentEpisodes = [];
  let targetEpisodeId = null;

  // --- Theme ---
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    $('#themeToggle').textContent = dark ? '☀️' : '🌙';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#1a1a2e' : '#5e5ce6';
  }
  if (savedTheme) {
    applyTheme(savedTheme === 'dark');
  } else {
    applyTheme(prefersDark.matches);
  }
  $('#themeToggle').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  });
  prefersDark.addEventListener('change', (e) => {
    if (!localStorage.getItem('theme')) applyTheme(e.matches);
  });

  // --- Offline detection ---
  function updateOfflineBanner() {
    const banner = $('#offlineBanner');
    if (!navigator.onLine) {
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }
  window.addEventListener('online', updateOfflineBanner);
  window.addEventListener('offline', updateOfflineBanner);
  updateOfflineBanner();

  // --- View switching ---
  function showView(name) {
    Object.entries(views).forEach(([k, el]) => {
      el.classList.toggle('active', k === name);
    });
    window.scrollTo(0, 0);
  }

  // --- Routing ---
  function navigateTo(hash) {
    if (hash) {
      location.hash = hash;
    } else {
      history.pushState(null, '', location.pathname);
      handleRoute();
    }
  }

  function handleRoute() {
    const hash = location.hash.slice(1);
    if (!hash) {
      showView('home');
      return;
    }
    const parts = hash.split('/');
    if (parts[0] === 'episodes' && parts[1]) {
      const podcastId = parts[1];
      if (!currentPodcast || currentPodcast.collectionId !== podcastId) {
        loadPodcastById(podcastId);
      } else if (!currentEpisodes.length) {
        renderPodcastHeader();
        showView('episodes');
        loadEpisodes();
      } else {
        showView('episodes');
      }
    } else if (parts[0] === 'shownotes' && parts[1] && parts[2]) {
      const podcastId = parts[1];
      const idx = parseInt(parts[2], 10);
      if (!currentPodcast || currentPodcast.collectionId !== podcastId) {
        loadPodcastAndShowNote(podcastId, idx);
      } else {
        renderShowNotes(idx);
        showView('shownotes');
      }
    } else {
      showView('home');
    }
  }

  window.addEventListener('hashchange', handleRoute);

  // --- Deep link handling ---
  function handleDeepLink() {
    const params = new URLSearchParams(location.search);
    let podcastId = null;
    let episodeId = null;

    // ?url=https://podcasts.apple.com/.../id1253186678?i=1000678901234
    const urlParam = params.get('url');
    if (urlParam) {
      const idMatch = urlParam.match(/\/id(\d+)/);
      if (idMatch) podcastId = idMatch[1];
      const epMatch = urlParam.match(/[?&]i=(\d+)/);
      if (epMatch) episodeId = epMatch[1];
    }

    // ?podcastId=1253186678&episodeId=1000678901234
    if (!podcastId) {
      podcastId = params.get('podcastId');
    }
    if (!episodeId) {
      episodeId = params.get('episodeId');
    }

    if (podcastId) {
      // Clean URL: replace query params with hash route
      const cleanUrl = location.pathname;
      history.replaceState(null, '', cleanUrl);
      targetEpisodeId = episodeId || null;
      navigateTo('episodes/' + podcastId);
      return true;
    }
    return false;
  }

  // --- iTunes API ---
  async function searchPodcasts(term) {
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&entity=podcast&limit=20`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('iTunes search failed');
    return (await res.json()).results;
  }

  async function lookupPodcast(id) {
    const url = `https://itunes.apple.com/lookup?id=${id}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('iTunes lookup failed');
    const data = await res.json();
    if (!data.results || !data.results.length) throw new Error('Podcast not found');
    return data.results[0];
  }

  // --- RSS parsing ---
  async function fetchRSS(feedUrl) {
    // Strategy 1: Direct fetch
    try {
      const res = await fetch(feedUrl);
      if (res.ok) {
        const xml = await res.text();
        const items = parseRSSXML(xml);
        if (items.length) return items;
      }
    } catch {}

    // Strategy 2: CORS proxy
    try {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(proxyUrl);
      if (res.ok) {
        const xml = await res.text();
        const items = parseRSSXML(xml);
        if (items.length) return items;
      }
    } catch {}

    // Strategy 3: rss2json fallback
    try {
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(apiUrl);
      if (res.ok) {
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length) {
          return data.items.map((item) => ({
            title: item.title,
            pubDate: item.pubDate,
            link: item.link,
            content: item.content || item.description || '',
            enclosure: item.enclosure?.link || '',
            duration: '',
          }));
        }
      }
    } catch {}

    throw new Error('RSS 源暂时不可用');
  }

  function parseRSSXML(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const errorNode = doc.querySelector('parsererror');
    if (errorNode) return [];

    return [...doc.querySelectorAll('item')].map((item) => {
      const getText = (tag) => {
        const el = item.getElementsByTagName(tag)[0];
        return el ? el.textContent : '';
      };
      const content = (() => {
        const encoded = item.getElementsByTagNameNS('*', 'encoded')[0];
        if (encoded) return encoded.textContent;
        return getText('description');
      })();
      const enclosure = item.querySelector('enclosure');
      const duration = item.getElementsByTagNameNS('*', 'duration')[0];
      return {
        title: getText('title'),
        pubDate: getText('pubDate'),
        link: getText('link'),
        content,
        enclosure: enclosure ? enclosure.getAttribute('url') : '',
        duration: duration ? duration.textContent : '',
      };
    });
  }

  // --- Rendering ---
  function renderLoading(container) {
    container.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';
  }

  function renderError(container, message, retryFn) {
    container.innerHTML = `
      <div class="error-state">
        <div class="icon">😕</div>
        <p>${message}</p>
        ${retryFn ? '<button onclick="(' + retryFn.toString() + ')()">重试</button>' : ''}
      </div>`;
  }

  function renderSearchResults(results) {
    const container = $('#searchResults');
    if (!results.length) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有找到相关播客</p></div>';
      return;
    }
    container.innerHTML = '<div class="results-grid">' + results.map((r) => {
      const artwork = (r.artworkUrl100 || '').replace('100x100', '200x200');
      return `
        <div class="podcast-card" data-id="${r.collectionId}" data-feed="${encodeURIComponent(r.feedUrl || '')}">
          <img src="${artwork}" alt="" loading="lazy">
          <div class="info">
            <h3>${esc(r.collectionName)}</h3>
            <p>${esc(r.artistName)}</p>
            <div class="meta">
              ${r.primaryGenreName ? `<span>${esc(r.primaryGenreName)}</span>` : ''}
              ${r.trackCount ? `<span>${r.trackCount} 集</span>` : ''}
            </div>
          </div>
        </div>`;
    }).join('') + '</div>';

    container.querySelectorAll('.podcast-card').forEach((card) => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        const feedUrl = decodeURIComponent(card.dataset.feed);
        const name = card.querySelector('h3').textContent;
        const artist = card.querySelector('p').textContent;
        const artwork = card.querySelector('img').src;
        const genre = card.querySelector('.meta span')?.textContent || '';
        currentPodcast = {
          collectionId: id,
          collectionName: name,
          artistName: artist,
          artworkUrl600: artwork,
          primaryGenreName: genre,
          feedUrl,
        };
        targetEpisodeId = null;
        renderPodcastHeader();
        showView('episodes');
        loadEpisodes();
        location.hash = 'episodes/' + id;
      });
    });
  }

  async function loadPodcastById(podcastId) {
    showView('episodes');
    renderLoading($('#episodeList'));

    try {
      const info = await lookupPodcast(podcastId);
      if (!info.feedUrl) {
        renderError($('#episodeList'), '该播客没有 RSS Feed', loadPodcastById.bind(null, podcastId));
        return;
      }
      currentPodcast = {
        collectionId: String(info.collectionId),
        collectionName: info.collectionName,
        artistName: info.artistName,
        artworkUrl600: (info.artworkUrl600 || info.artworkUrl100 || '').replace('100x100', '600x600'),
        primaryGenreName: info.primaryGenreName || '',
        feedUrl: info.feedUrl,
      };
      renderPodcastHeader();
      await loadEpisodes();
    } catch (e) {
      renderError($('#podcastHeader'), '加载播客信息失败', () => {
        location.hash = '';
        showView('home');
      });
    }
  }

  async function loadPodcastAndShowNote(podcastId, idx) {
    showView('episodes');
    renderLoading($('#episodeList'));
    try {
      const info = await lookupPodcast(podcastId);
      if (!info.feedUrl) {
        renderError($('#episodeList'), '该播客没有 RSS Feed');
        return;
      }
      currentPodcast = {
        collectionId: String(info.collectionId),
        collectionName: info.collectionName,
        artistName: info.artistName,
        artworkUrl600: (info.artworkUrl600 || info.artworkUrl100 || '').replace('100x100', '600x600'),
        primaryGenreName: info.primaryGenreName || '',
        feedUrl: info.feedUrl,
      };
      renderPodcastHeader();
      await loadEpisodes();
      renderShowNotes(idx);
      showView('shownotes');
    } catch (e) {
      renderError($('#podcastHeader'), '加载播客信息失败');
    }
  }

  function renderPodcastHeader() {
    if (!currentPodcast) return;
    $('#podcastHeader').innerHTML = `
      <div class="podcast-header">
        <img src="${currentPodcast.artworkUrl600}" alt="" loading="lazy">
        <div class="info">
          <h2>${esc(currentPodcast.collectionName)}</h2>
          <p>${esc(currentPodcast.artistName)}</p>
        </div>
      </div>`;
  }

  async function loadEpisodes() {
    renderLoading($('#episodeList'));
    try {
      currentEpisodes = await fetchRSS(currentPodcast.feedUrl);
      if (!currentEpisodes.length) {
        renderError($('#episodeList'), '该播客没有剧集');
        return;
      }
      renderEpisodeList();
    } catch (e) {
      renderError($('#episodeList'), 'RSS 源暂时不可用', loadEpisodes);
    }
  }

  function renderEpisodeList() {
    const container = $('#episodeList');
    container.innerHTML = '<div class="episode-list">' + currentEpisodes.map((ep, i) => {
      const date = ep.pubDate ? formatDate(ep.pubDate) : '';
      const duration = ep.duration ? formatDuration(ep.duration) : '';
      return `
        <div class="episode-card" data-idx="${i}">
          <h3>${esc(ep.title || '无标题')}</h3>
          <div class="meta">
            ${date ? `<span>${date}</span>` : ''}
            ${duration ? `<span>${duration}</span>` : ''}
          </div>
        </div>`;
    }).join('') + '</div>';

    container.querySelectorAll('.episode-card').forEach((card) => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.idx, 10);
        navigateTo('shownotes/' + currentPodcast.collectionId + '/' + idx);
      });
    });

    // Auto-locate episode by episodeId: navigate directly to show notes
    if (targetEpisodeId) {
      autoLocateEpisode(targetEpisodeId);
      targetEpisodeId = null;
    }
  }

  async function autoLocateEpisode(episodeId) {
    // Strategy 1: direct match in guid/link/enclosure
    let idx = currentEpisodes.findIndex((ep) => {
      const haystack = (ep.link || '') + (ep.enclosure || '');
      return haystack.includes(episodeId);
    });

    // Strategy 2: iTunes Lookup by podcastId + entity=podcastEpisode,
    // find the episode with trackId === episodeId, match by title in RSS
    if (idx < 0 && currentPodcast) {
      try {
        const url = `https://itunes.apple.com/lookup?id=${currentPodcast.collectionId}&entity=podcastEpisode&limit=200`;
        const res = await fetch(url);
        const data = await res.json();
        const episodes = (data.results || []).filter((r) => r.wrapperType === 'podcastEpisode');
        const match = episodes.find((e) => String(e.trackId) === episodeId);
        if (match && match.trackName) {
          const lookupTitle = normalizeTitle(match.trackName);
          idx = currentEpisodes.findIndex((ep) => {
            return normalizeTitle(ep.title) === lookupTitle;
          });
          // Fallback: fuzzy title match (first 30 chars)
          if (idx < 0) {
            const prefix = lookupTitle.slice(0, 30);
            idx = currentEpisodes.findIndex((ep) => {
              return normalizeTitle(ep.title).startsWith(prefix);
            });
          }
        }
      } catch {}
    }

    if (idx >= 0 && currentPodcast) {
      navigateTo('shownotes/' + currentPodcast.collectionId + '/' + idx);
    }
  }

  function normalizeTitle(t) {
    return (t || '').toLowerCase().replace(/[^\w一-鿿]/g, '').trim();
  }

  function renderShowNotes(idx) {
    const ep = currentEpisodes[idx];
    if (!ep) return;
    const date = ep.pubDate ? formatDate(ep.pubDate) : '';
    $('#shownotesContent').innerHTML = `
      <div class="shownotes-header">
        <h2>${esc(ep.title || '无标题')}</h2>
        <div class="meta">${date}</div>
      </div>
      <div class="shownotes-content">${ep.content || '<p>该剧集没有 Show Notes</p>'}</div>`;
    showView('shownotes');
    window.scrollTo(0, 0);
  }

  // --- Search ---
  async function doSearch() {
    const term = $('#searchInput').value.trim();
    if (!term) return;
    const container = $('#searchResults');
    renderLoading(container);
    try {
      const results = await searchPodcasts(term);
      renderSearchResults(results);
    } catch (e) {
      renderError(container, '搜索失败，请重试', doSearch);
    }
  }

  $('#searchBtn').addEventListener('click', doSearch);
  $('#searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
  });

  // --- Back buttons ---
  $('#backToSearch').addEventListener('click', () => {
    currentPodcast = null;
    currentEpisodes = [];
    navigateTo('');
  });
  $('#backToEpisodes').addEventListener('click', () => {
    navigateTo('episodes/' + (currentPodcast?.collectionId || ''));
  });

  // --- Helpers ---
  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatDate(dateStr) {
    try {
      const d = new Date(dateStr);
      return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch {
      return dateStr;
    }
  }

  function formatDuration(dur) {
    if (/^\d+$/.test(dur)) {
      const s = parseInt(dur, 10);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (h) return `${h}h ${m}m`;
      return `${m || Math.floor(s / 60)}m`;
    }
    return dur;
  }

  // --- Init ---
  if (!handleDeepLink()) {
    handleRoute();
  }

  // --- Service Worker ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
